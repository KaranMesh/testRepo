name: Build repos and Deploy

on:
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  build-repo:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout testRepo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.REPO_PAT }}
          repository: KaranMesh/testRepo
          path: testRepo
      - name: Switch branch for testRepo
        run: |
          cd testRepo
          git fetch origin main
          git checkout main
      - name: Set up Java
        uses: actions/setup-java@v3
        with:
          distribution: 'corretto'
          java-version: '8'
      - name: Build testRepo
        run: |
          cd testRepo
          ls
          cd crud
          mvn clean install -DskipTests
      - name: Send notification to Zoom
        if: always()
        run: |
          STATUS="Success"
          if [[ '${{ job.status }}' != 'success' ]]; then
            STATUS="Failure"
          fi

          curl -X POST \
            -H 'Content-Type: application/json' \
            -d "{
                  \"content\": \"GitHub Action: *${{ github.workflow }}*  
                  Status: *$STATUS*  
                  Commit: ${{ github.sha }}\"
                }" \
            https://integrations.zoom.us/chat/webhooks/incomingwebhook/0wi7cxtPQ3eCwxGbqa99Iw?format=message
      
