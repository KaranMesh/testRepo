name: Build repos and Deploy

on:
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  build-repo:
    runs-on: ubuntu-latest

    steps:
      - name: Send test message to Zoom
        run: |
          STATUS="Success"

          MESSAGE="GitHub Action Test Message
                    Status: $STATUS
                    Repo: ${{ github.repository }}
                    Branch: ${{ github.ref_name }}
                    Commit: ${{ github.sha }}"

          curl "https://integrations.zoom.us/chat/webhooks/incomingwebhook/0wi7cxtPQ3eCwxGbqa99Iw?format=message" \
            -X POST \
            -H "Authorization: 70ToruRKRTerZ4xw170VmQ" \
            -H "Content-Type: application/json" \
            -d "$MESSAGE"
      
