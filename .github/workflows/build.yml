name: Build repos and Deploy

on:
  pull_request:
    types:
      - opened
      - synchronize

jobs:
  build-repo:
    runs-on: ubuntu-latest

    steps:
      - name: Send notification to Zoom
        if: always()
        run: |
          STATUS="Success"
          if [[ '${{ job.status }}' != 'success' ]]; then
            STATUS="Failure"
          fi

          curl -X POST \
            -H 'Content-Type: application/json' \
            -d "{
                  \"content\": \"GitHub Action: *${{ github.workflow }}*  
                  Status: *$STATUS*  
                  Commit: ${{ github.sha }}\"
                }" \
            https://integrations.zoom.us/chat/webhooks/incomingwebhook/0wi7cxtPQ3eCwxGbqa99Iw?format=fields
      
